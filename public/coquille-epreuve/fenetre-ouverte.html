  <body>
    <main>
      <h1>Fenêtre ouverte</h1>
      <p>
        Cette page ne fait rien. Ce qu'on mesure d'elle est ce que le NAVIGATEUR lui a laissé :
        `window.opener`, lu depuis l'épreuve. Sous
        <code>Cross-Origin-Opener-Policy: same-origin</code>, il est nul.
      </p>
