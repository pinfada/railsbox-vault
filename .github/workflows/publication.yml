name: Publication

# Chaîne de publication des DEUX origines de l'ADR 0002 (#45, ADR 0017).
#
# Elle construit (image de référence comprise : `--avec-image`), vérifie, éprouve les en-têtes servis,
# prouve le démarrage sur l'arbre publié SEUL (Chromium), mesure les limites de l'hébergeur, et dépose
# les deux arborescences comme artefacts GitHub. Son dernier maillon, l'ENVOI (`deployer`), est écrit
# mais INERTE : il ne part que sur `envoyer: true`, derrière l'environnement `production` (approbation
# manuelle, créé par le mainteneur), et seulement si les secrets existent. Sans eux, ou sans la demande,
# c'est la RÉPÉTITION À BLANC : elle affiche exactement ce qui serait envoyé et n'envoie rien. L'hébergeur
# n'est pas choisi par ce dépôt : `docs/release-policy.md` § « Envoi chez l'hébergeur » liste ce que le
# mainteneur doit créer.
#
# `workflow_dispatch` SEULEMENT, et c'est délibéré. Une chaîne de publication qui se déclenche sur
# `push` publie sans que personne l'ait décidé. `docs/release-policy.md` fait de la publication un
# acte — changelog, inventaire, rollback testé — et non un effet de bord d'une fusion.
#
# Elle n'est pas un contrôle obligatoire de la protection de branche : `npm run check` porte déjà la
# construction, la vérification et le témoin d'en-têtes sur Chromium (`npm run publier:check`).
# Ce workflow ajoute ce que `check` ne peut pas faire dans son budget : les artefacts v86 réels, les
# trois moteurs, et l'épreuve de retour arrière.
#
# ## Pourquoi AUCUN `${{ … }}` n'apparaît dans un bloc `run:`
#
# Une interpolation de template dans un `run:` est substituée par le moteur d'Actions AVANT que le
# shell ne voie la ligne : une valeur de `inputs` bien choisie n'est plus une chaîne, c'est du code
# exécuté sur l'exécutant qui produit l'arbre ET affiche son empreinte — c'est-à-dire précisément
# l'endroit où la comparaison hors bande perdrait tout sens. Toutes les entrées passent donc par
# `env:` et sont lues comme "$VARIABLE" par le shell, qui les traite en données.
# `tests/unit/workflows-sans-interpolation.test.mjs` en fait un cliquet pour les workflows à venir.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit ou étiquette à publier (défaut : le commit courant)"
        required: false
        type: string
      origine-coquille:
        description: "Origine de confiance servie en production"
        required: false
        default: "https://vault.exemple"
        type: string
      origine-application:
        description: "Origine du territoire applicatif"
        required: false
        default: "https://app.vault.exemple"
        type: string
      rollback-vers:
        description:
          "Commit d'une publication antérieure, reconstruit pour éprouver le retour arrière"
        required: false
        type: string
      empreinte-attendue:
        description:
          "Empreinte de racine de la coquille inscrite lors de la publication d'alors, à confronter
          à la reconstruction"
        required: false
        type: string
      profil-hebergeur:
        description:
          "Limites de l'hébergeur à mesurer sur les arbres (tools/publier-limites-hebergeur.mjs)"
        required: false
        default: "cloudflare-pages"
        type: choice
        options:
          - cloudflare-pages
          - netlify
      envoyer:
        description:
          "Envoyer chez l'hébergeur (job `deployer`, environnement `production`). Sans cela, ou sans
          les secrets : répétition à blanc, rien n'est envoyé."
        required: false
        default: false
        type: boolean
      projet-pages-coquille:
        description:
          "Nom du projet Cloudflare Pages de la COQUILLE (utilisé seulement pour l'envoi)"
        required: false
        type: string
      projet-pages-application:
        description:
          "Nom du projet Cloudflare Pages de l'APPLICATION (utilisé seulement pour l'envoi)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audits:
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ inputs.commit || github.sha }}

  # L'image de référence : le descripteur ET les artefacts qu'il nomme (rootfs, paquet, noyau, initrd,
  # BIOS). Même recette que `reprise.yml` (ubuntu-24.04 : voir le cliquet
  # `tests/unit/workflows-image-sur-ubuntu-24-04.test.mjs`). La fabrication n'est pas reproductible au bit
  # près : l'image publiée est CELLE de ce run, et l'inventaire en porte l'empreinte.
  image:
    name: Construire l'image de référence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0

      - name: Installation de Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Épinglage de la chaîne de construction
        run: node tools/build-reference-image/verify-pinning.mjs

      - name: Construction de l'image de référence
        run: npm run image:build

      - name: Partage de l'image construite
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-de-reference
          path: |
            artifacts/reference-image/
            artifacts/application.json
          retention-days: 1

  publier:
    name: Construire, vérifier et éprouver les en-têtes
    needs: [audits, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VAULT_COMMIT: ${{ inputs.commit || github.sha }}
      VAULT_ORIGINE_COQUILLE: ${{ inputs.origine-coquille }}
      VAULT_ORIGINE_APPLICATION: ${{ inputs.origine-application }}
      VAULT_ROLLBACK_VERS: ${{ inputs.rollback-vers }}
      VAULT_EMPREINTE_ATTENDUE: ${{ inputs.empreinte-attendue }}
      VAULT_PROFIL: ${{ inputs.profil-hebergeur || 'cloudflare-pages' }}

    steps:
      # `fetch-depth: 0` n'est pas un confort : `--commit <ref>` lit les octets par `git show`, et
      # le retour arrière reconstruit un commit ANTÉRIEUR. Un clone superficiel ne le contiendrait
      # pas, et l'épreuve de rollback échouerait pour une raison étrangère à ce qu'elle mesure.
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Installation de Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Installation des moteurs de navigateur
        run: npx playwright install --with-deps chromium firefox webkit

      # Le runtime v86 fait partie de l'artefact publié. Sans cette étape la construction sortirait
      # en code 6 (« arbre incomplet ») plutôt que de publier un artefact amputé en silence.
      - name: Récupération vérifiée des artefacts v86
        run: npm run vm:fetch

      # `path: artifacts` : l'artefact porte `reference-image/` ET `application.json`, un SIBLING.
      - name: Récupération de l'image construite
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-de-reference
          path: artifacts

      # `--avec-image` : le descripteur et tout ce qu'il nomme entrent dans l'arbre de la coquille,
      # inventoriés et hachés comme le reste. Sans lui l'arbre publié ne démarre pas (#45).
      - name: Construction des deux arborescences
        run: |
          mkdir -p reports
          node tools/publier.mjs \
            --avec-image \
            --commit "$VAULT_COMMIT" \
            --origine-coquille "$VAULT_ORIGINE_COQUILLE" \
            --origine-application "$VAULT_ORIGINE_APPLICATION" \
            | tee reports/construction.txt

      # Vérifier ce qu'on vient de construire n'est pas une tautologie : la vérification relit le
      # DISQUE, recalcule chaque empreinte et refuse un fichier ajouté. Elle attraperait une étape
      # de la chaîne qui déposerait quelque chose dans l'arbre après la construction.
      - name: Vérification de l'inventaire des deux arbres
        run: |
          node tools/publier.mjs --verifier artifacts/publication/coquille
          node tools/publier.mjs --verifier artifacts/publication/application

      # LIMITES DE L'HÉBERGEUR, mesurées sur le disque. Un dépassement (code 7) est RAPPORTÉ ici, pas masqué :
      # il ne rougit pas cette étape, parce que ce run sert aussi à lire ce qui bloque l'envoi — mais le job
      # `deployer` le REFUSE (code 7). Tout autre code échoue.
      - name: Limites de l'hébergeur (rapport)
        run: |
          : > reports/limites-hebergeur.txt
          for arbre in coquille application; do
            set +e
            node tools/publier.mjs --verifier "artifacts/publication/$arbre" --profil "$VAULT_PROFIL" \
              | tee -a reports/limites-hebergeur.txt
            code=${PIPESTATUS[0]}
            set -e
            echo "$arbre : code de sortie $code" | tee -a reports/limites-hebergeur.txt
            if [ "$code" != 0 ] && [ "$code" != 7 ]; then
              exit "$code"
            fi
          done
          {
            echo '### Limites de l'"'"'hébergeur'
            echo '```'
            cat reports/limites-hebergeur.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Empreintes de racine, pour comparaison hors bande
        run: |
          : > reports/empreintes-de-racine.txt
          for arbre in coquille application; do
            racine=$(node tools/publier-empreinte.mjs "artifacts/publication/$arbre")
            echo "$arbre $racine" | tee -a reports/empreintes-de-racine.txt
          done
          cat reports/empreintes-de-racine.txt >> "$GITHUB_STEP_SUMMARY"

      # Le témoin exige des origines de TEST : c'est ainsi qu'il obtient deux origines réelles sans
      # DNS. Il travaille donc sur un arbre de banc, dans un répertoire distinct, et les arbres
      # publiés ne sont jamais touchés — un arbre de banc porte d'ailleurs `banc: true` dans son
      # inventaire, pour qu'aucun des deux ne puisse être pris pour l'autre.
      - name: Témoin d'en-têtes sur les trois moteurs
        env:
          VAULT_MOTEURS: chromium,firefox,webkit
        run: |
          npm run publier:check
          node tools/publier-sonde-meta-csp.mjs

      # LA PREUVE qui manquait : l'application démarre sur l'arbre publié SEUL, sans servir le dossier local
      # `artifacts/` (tests/e2e/publie-seul.spec.mjs). `VAULT_E2E_EXIGER` ferme le vert par vacuité.
      - name: Démarrage sur l'arbre publié seul (Chromium)
        env:
          VAULT_E2E_EXIGER: "1"
        run:
          npx playwright test --config playwright.e2e.config.mjs --project=chromium --workers=1
          tests/e2e/publie-seul.spec.mjs

      # RETOUR ARRIÈRE. Deux reconstructions du même commit doivent rendre la même empreinte de
      # racine : c'est le DÉTERMINISME, sans lequel « republier la version précédente » ne serait
      # pas une opération définie. Si `empreinte-attendue` est fournie — l'empreinte qu'avait
      # inscrite la publication d'alors —, la reconstruction lui est en outre confrontée, et c'est
      # cette seconde comparaison qui prouve qu'on republie bien CETTE version-là.
      - name: Épreuve de retour arrière
        if: inputs.rollback-vers != ''
        run: |
          node tools/publier.mjs --commit "$VAULT_ROLLBACK_VERS" --sortie artifacts/rollback-a
          node tools/publier.mjs --commit "$VAULT_ROLLBACK_VERS" --sortie artifacts/rollback-b
          node tools/publier.mjs --verifier artifacts/rollback-a/coquille
          a=$(node tools/publier-empreinte.mjs artifacts/rollback-a/coquille)
          b=$(node tools/publier-empreinte.mjs artifacts/rollback-b/coquille)
          echo "reconstruction A : $a"
          echo "reconstruction B : $b"
          if [ "$a" != "$b" ]; then
            echo "La reconstruction n'est pas déterministe." >&2
            exit 1
          fi
          if [ -n "$VAULT_EMPREINTE_ATTENDUE" ]; then
            echo "empreinte attendue : $VAULT_EMPREINTE_ATTENDUE"
            if [ "$a" != "$VAULT_EMPREINTE_ATTENDUE" ]; then
              echo "La reconstruction ne retrouve PAS l'empreinte de la publication d'alors." >&2
              exit 1
            fi
            echo "La reconstruction retrouve l'empreinte de la publication d'alors."
          else
            echo "Aucune empreinte attendue fournie : seul le déterminisme est éprouvé."
          fi

      # `npm run publier:check` a laissé un arbre de BANC ; les arbres publiés, eux, n'ont pas
      # bougé. On les revérifie tout de même avant de les déposer : une étape intermédiaire qui
      # aurait écrit dans `artifacts/publication/` serait attrapée ici et non chez l'hébergeur.
      - name: Revérification avant dépôt
        run: |
          node tools/publier.mjs --verifier artifacts/publication/coquille
          node tools/publier.mjs --verifier artifacts/publication/application

      - name: Arborescence de l'origine de confiance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-coquille
          path: artifacts/publication/coquille/
          if-no-files-found: error
          retention-days: 90

      - name: Arborescence du territoire applicatif
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-application
          path: artifacts/publication/application/
          if-no-files-found: error
          retention-days: 90

      # Les inventaires partent AUSSI séparément. C'est la seule chose qui donne une valeur à
      # l'empreinte de racine : comparée hors bande à un arbre téléchargé, elle détecte une
      # altération que l'inventaire embarqué — réécrit par le même adversaire — ne détecterait pas.
      - name: Inventaires et relevés
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-inventaires
          path: |
            artifacts/publication/coquille/inventaire.json
            artifacts/publication/application/inventaire.json
            reports/
          if-no-files-found: warn
          retention-days: 90

  # RÉPÉTITION À BLANC de l'envoi : aucun environnement, aucun secret — ils ne sont pas même référencés
  # ici. Elle relit les arbres téléchargés (vérification d'inventaire), mesure les limites de l'hébergeur
  # et affiche exactement ce que `deployer` enverrait : arbre, projet, commande wrangler épinglée. Un
  # dépassement y est RAPPORTÉ (c'est son résultat), jamais envoyé.
  repetition:
    name: Répétition à blanc de l'envoi (rien n'est envoyé)
    needs: publier
    if: ${{ !inputs.envoyer }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VAULT_PROFIL: ${{ inputs.profil-hebergeur || 'cloudflare-pages' }}
      VAULT_PROJET_COQUILLE: ${{ inputs.projet-pages-coquille || 'projet-coquille-a-definir' }}
      VAULT_PROJET_APPLICATION:
        ${{ inputs.projet-pages-application || 'projet-application-a-definir' }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Récupération de l'arborescence de la coquille
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-coquille
          path: artifacts/publication/coquille

      - name: Récupération de l'arborescence de l'application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-application
          path: artifacts/publication/application

      # Ce qui a traversé le dépôt d'artefacts est ce qui a été construit : l'inventaire est recalculé.
      - name: Vérification de l'inventaire des arbres téléchargés
        run: |
          node tools/publier.mjs --verifier artifacts/publication/coquille
          node tools/publier.mjs --verifier artifacts/publication/application

      - name: Répétition à blanc
        run: |
          mkdir -p reports
          {
            node tools/publier-envoi.mjs --repetition --profil "$VAULT_PROFIL" \
              --arbre artifacts/publication/application --projet "$VAULT_PROJET_APPLICATION"
            echo
            node tools/publier-envoi.mjs --repetition --profil "$VAULT_PROFIL" \
              --arbre artifacts/publication/coquille --projet "$VAULT_PROJET_COQUILLE"
          } | tee reports/repetition.txt
          {
            echo '### Répétition à blanc de l'"'"'envoi'
            echo '```'
            cat reports/repetition.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Récapitulatif de la répétition
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-repetition
          path: reports/repetition.txt
          retention-days: 90

  # L'ENVOI. Inerte tant que `envoyer` n'est pas vrai ; derrière l'environnement `production` (approbation
  # manuelle — à créer par le mainteneur, avec ses secrets). Sans les secrets, il s'arrête en répétition à
  # blanc ET LE DIT ; avec eux, il REFUSE un dépassement de limite (code 7) avant d'appeler wrangler.
  # Les secrets ne sont lus que par l'étape d'envoi, par `env:` — jamais dans un `run:` — et l'outil n'imprime
  # que leur présence.
  deployer:
    name: Envoyer chez l'hébergeur
    needs: publier
    if: ${{ inputs.envoyer }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Récupération de l'arborescence de la coquille
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-coquille
          path: artifacts/publication/coquille

      - name: Récupération de l'arborescence de l'application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publication-application
          path: artifacts/publication/application

      - name: Vérification de l'inventaire des arbres téléchargés
        run: |
          node tools/publier.mjs --verifier artifacts/publication/coquille
          node tools/publier.mjs --verifier artifacts/publication/application

      # L'application d'abord : la coquille la cadre, et une coquille servie avant son territoire
      # applicatif pointerait vers rien. Chaque appel refuse un dépassement de limite (code 7).
      - name: Envoi (ou répétition à blanc si les secrets manquent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAULT_PROFIL: ${{ inputs.profil-hebergeur || 'cloudflare-pages' }}
          VAULT_PROJET_COQUILLE: ${{ inputs.projet-pages-coquille }}
          VAULT_PROJET_APPLICATION: ${{ inputs.projet-pages-application }}
        run: |
          node tools/publier-envoi.mjs --envoyer --profil "$VAULT_PROFIL" \
            --arbre artifacts/publication/application --projet "$VAULT_PROJET_APPLICATION"
          node tools/publier-envoi.mjs --envoyer --profil "$VAULT_PROFIL" \
            --arbre artifacts/publication/coquille --projet "$VAULT_PROJET_COQUILLE"
