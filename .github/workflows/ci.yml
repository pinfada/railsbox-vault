name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Qualité et tests
    runs-on: ubuntu-latest
    # Portée de 20 à 25 minutes le 8 septembre 2026 (#169). Le motif est une DURÉE D'ATTENTE : ce
    # gate porte des épreuves qui mesurent des bornes de TEMPS — trente secondes pour le Worker MUET
    # et quarante pour le Worker LENT (#163), une minute pour le verrouillage par inactivité et une
    # minute et demie pour son témoin négatif (#169) —, et une borne ne se raccourcit pas sans
    # mesurer autre chose que ce qu'elle mesure.
    #
    # Ce que la MESURE dit, et elle vaut mieux qu'une estimation : `main` (run 34167283465) tenait en
    # 15 min 06 s, #174 en 16 min 21 s. **L'écart réel est de +1 min 15 s pour +2 min 30 s d'attente
    # annoncée** — la parallélisation en absorbe la moitié, les projets d'un autre moteur tournant
    # pendant qu'un projet attend. Vingt-cinq minutes sont donc une MARGE, pas une nécessité : 16 min
    # 21 s tenaient déjà sous l'ancien plafond de vingt. La marge est prise pour un exécutant partagé
    # plus lent, et elle reste assez basse pour que le plafond morde encore.
    #
    # Portée de 25 à 28 minutes le 9 septembre 2026 (#170), et le motif est encore une MESURE, pas
    # une précaution : le dernier run de cette branche AVANT que la suite des fins d'onglet entre
    # dans `npm run check` a tenu en **20 min 42 s** (run 34314197368) — bien au-delà des 16 min
    # 21 s relevées sur #174, l'exécutant partagé décidant du reste. La suite ajoute environ **55 s**
    # mesurées en local, sur trois moteurs. Trois minutes de marge sur un exécutant qui varie déjà
    # de quatre ne sont pas une marge ; vingt-huit en laissent six, et le plafond mord encore.
    #
    # **Le plafond ne bouge pas le 9 septembre 2026 (#178), et c'est une décision mesurée.** Le run
    # 34395610878 de cette branche a été TUÉ au plafond, à 28 min 34 s, pendant
    # `test:fins-d-onglet`. Ce n'est pas le volume de la suite qui l'a fait déborder : ce sont les
    # BLOCAGES du flottement Firefox. Sept épreuves reprises, dont les sept premiers essais ont
    # expiré à 120 s chacun — quatorze minutes de temps de test sur deux ouvriers, sept minutes de
    # pendule —, plus une expiration à 300 s dans `test:fins-d-onglet`. La suite navigateur a rendu
    # 19 min 30 s là où, sans ces sept blocages, elle en aurait rendu douze et demie.
    #
    # Un run SANS reprise tient donc autour de **vingt minutes**, et vingt-huit en laissent huit de
    # marge : c'est la règle de #177 appliquée telle quelle. Ce qui manquait, c'était que le coût
    # d'UN blocage reste borné. Il l'est depuis cette tranche : `navigationTimeout: 60_000` dans
    # `playwright.config.mjs` et `playwright.fins-d-onglet.config.mjs` ramène un blocage de 120 s à
    # 60 et un de 300 s à 60, sans rien cacher — l'épreuve échoue quand même, la reprise est comptée,
    # et le compte est publié dans le résumé du job par l'étape ci-dessous.
    timeout-minutes: 28
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Installation des moteurs de navigateur
        run: npx playwright install --with-deps chromium firefox webkit

      # `xvfb-run` fournit un AFFICHAGE, et il en faut un : la mesure du bfcache de #170 exige un
      # Chromium FENÊTRÉ, parce que sans fenêtre aucun moteur ne restaure de document — pas même une
      # page nue — et que la conclusion « jamais restauré » décrirait alors l'exécutant et non le
      # moteur (constat 2 de la revue de sécurité de la PR #177). Sans `DISPLAY`, le projet
      # `chromium-fenetre` n'est pas déclaré et le dit sur la sortie standard : un skip nommé, jamais
      # un silence. `--auto-servernum` prend un numéro d'écran libre ; `xvfb` vient avec
      # `playwright install --with-deps`. Le reste des suites ne change pas de comportement.
      - name: Vérifications
        run: xvfb-run --auto-servernum npm run check

      # #178 n'est plus absorbée par une reprise d'épreuve : la fixture commune ne récupère que la
      # signature « document Firefox complet + page.goto sans réponse » et l'annote. Ce relevé
      # publie chaque récupération et vérifie aussi que le compte historique des reprises reste à
      # zéro. Un rapport absent est NOMMÉ plutôt que pris pour zéro ; `if: always()` conserve la
      # mesure même quand une autre panne a fait rougir le gate.
      - name: Stabilité des navigations Firefox
        if: always()
        run: >
          node tools/compter-reprises.mjs playwright-report/rapport.json
          playwright-report/rapport-compat.json playwright-report/rapport-fins-d-onglet.json

      - name: Rapports de compatibilité
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-compatibilite
          path: reports/compat/
          if-no-files-found: warn
          retention-days: 30

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
