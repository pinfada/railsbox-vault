name: Vérifications

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Qualité et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Installation des moteurs de navigateur
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Vérifications
        run: npm run check

      - name: Rapports de compatibilité
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rapports-compatibilite
          path: reports/compat/
          if-no-files-found: warn
          retention-days: 30

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
