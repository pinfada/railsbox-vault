name: Reprise MVP

# Scénario de sortie du MVP (#7) : une mutation Rails retrouvée après fermeture complète et boot à
# froid hors ligne. La recette construit l'image de référence (compilation Ruby/gemmes sous i386),
# récupère les artefacts v86, puis boote plusieurs fois un guest Rails complet dans Chromium.
#
# Elle est longue et dépend de Docker et d'artefacts tiers : elle n'est donc PAS un contrôle
# obligatoire de la protection de branche, et `npm run check` ne l'appelle pas. Sa périodicité et son
# coût sont documentés dans docs/testing.md.

on:
  workflow_dispatch:
    inputs:
      workers:
        description: >-
          Ouvriers Playwright pour les scénarios E2E (mesure #200 : 1 contre 2 sur le même commit).
          Le déclenchement automatique (nocturne, PR stabilisée) utilise la valeur retenue
          ci-dessous, pas ce champ.
        required: false
        default: "2"
        type: string
  schedule:
    - cron: "41 4 * * *"
  pull_request:
    # Plus de run à chaque `synchronize` (#200) : la recette complète est longue et coûteuse, et
    # un push intermédiaire n'a que la CI rapide (`Vérifications`) à satisfaire. Elle se déclenche
    # quand la PR est jugée stabilisée — passage en « prêt pour revue », ou pose du label
    # `recette` par le superviseur (`if` du job, plus bas, l'exige nommément) — plus le nocturne et
    # le déclenchement manuel ci-dessus. `docs/testing.md` dit QUAND l'exiger avant fusion.
    types: [ready_for_review, labeled]
    paths:
      - "src/vm/**"
      - "src/coquille/**"
      - "public/vm/**"
      - "public/main.mjs"
      - "public/coquille/**"
      - "public/document-applicatif.html"
      - "public/document-applicatif.mjs"
      - "public/runtime-worker.mjs"
      - "public/index.html"
      - "tests/e2e/**"
      - "playwright.e2e.config.mjs"
      - "tools/serve.mjs"
      - "tools/serve-headers.mjs"
      - "tools/build-reference-image/manifest.mjs"
      - ".github/workflows/reprise.yml"

permissions:
  contents: read

concurrency:
  group: reprise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reprise:
    name: Reprise d'une mutation Rails après boot à froid
    # `labeled` se déclenche pour N'IMPORTE QUEL label : sans ce garde-fou, poser une étiquette de
    # tri sans rapport lancerait la recette complète. Seul `recette`, posé par le superviseur une
    # fois la PR stabilisée, doit le faire ; `ready_for_review` et les autres déclencheurs passent.
    if: >-
      github.event_name != 'pull_request' || github.event.action != 'labeled' ||
      github.event.label.name == 'recette'
    runs-on: ubuntu-latest
    # Construction de l'image environ 20 min sans cache, puis préparation OPFS et plusieurs boots à
    # froid d'un Rails i386. La marge couvre un exécutant GitHub plus lent que la machine de dev.
    #
    # Portée à 150 min le 6 septembre 2026 (#149) : le scénario
    # `archive-recuperation-inter-origine.spec.mjs` ajoute deux boots Rails et une dérivation
    # Argon2id à la suite, et les scénarios s'exécutent en SÉQUENCE (`workers: 1`). Une marge qui
    # devient juste finit par faire échouer la recette pour une raison qui n'est pas la sienne.
    #
    # Inchangée le 7 septembre 2026 (#163) : `reprise-coquille-boot-froid.spec.mjs` ajoute deux boots
    # Rails et deux dérivations Argon2id — environ dix minutes de plus en séquence —, et la marge de
    # 120 min les couvre. La porter plus haut sans mesure ferait passer un job qui traîne pour un job
    # qui travaille.
    timeout-minutes: 120

    env:
      # `github.event.inputs` est vide hors `workflow_dispatch` : le nocturne, le label et
      # `ready_for_review` retombent donc sur « 2 », la valeur retenue par la mesure de #200
      # (docs/quality-attributes.md, § Reprise MVP : un ou deux ouvriers). Le champ du
      # déclenchement manuel sert à REJOUER la mesure, pas à piloter la production.
      VAULT_E2E_WORKERS: ${{ github.event.inputs.workers || '2' }}

    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Installation de Chromium
        run: npx playwright install --with-deps chromium

      - name: Épinglage de la chaîne de construction
        run: node tools/build-reference-image/verify-pinning.mjs

      # Mesures d'espace disque (#73). Le quota OPFS que Chromium accorde à une origine est dérivé de
      # l'espace RÉELLEMENT libre du disque ; une écriture OPFS courte en CI et jamais en local pose
      # donc d'abord la question de la place restante. Ces mesures la documentent à chaque étape et
      # partent avec les artefacts. Elles n'échouent jamais : elles n'ont rien à décider.
      - name: Espace disque au départ
        run: node tools/mesure-espace-disque.mjs --etape depart

      - name: Construction de l'image de référence
        run: npm run image:build

      - name: Espace disque après construction de l'image
        run: node tools/mesure-espace-disque.mjs --etape apres-image-build

      - name: Récupération vérifiée des artefacts v86
        run: npm run vm:fetch

      - name: Espace disque avant les scénarios
        run: node tools/mesure-espace-disque.mjs --etape avant-e2e

      # Le suivi tourne PENDANT les scénarios (#73) : une mesure avant et une après ne disent rien
      # d'une ressource qui s'épuise au milieu, et c'est au milieu que l'écriture OPFS est refusée.
      # Le code de sortie des scénarios est celui de l'étape — le suivi n'a pas le droit de le
      # masquer, ni en le remplaçant par le sien, ni en faisant échouer l'étape à sa place.
      # `VAULT_E2E_EXIGER` ferme le VERT PAR VACUITÉ (#163). Cette recette construit l'image de
      # référence et récupère les artefacts v86 : elle n'a donc aucune raison de voir un scénario
      # s'ignorer, et un scénario ignoré est un défaut de RECETTE, pas un scénario indisponible.
      # Elle a rendu « 8 passed, 1 skipped » sur la PR #171 sans dire lequel ni pourquoi ; sous
      # cette variable, chaque préalable absent est un échec qui NOMME ce qui manque.
      - name: Reprise MVP (E2E)
        env:
          VAULT_E2E_EXIGER: "1"
        run: |
          echo "[reprise] ouvriers Playwright : $VAULT_E2E_WORKERS"
          node tools/mesure-espace-disque.mjs --etape pendant-e2e --suivre 5 \
            --journal reports/e2e/espace-pendant-e2e.jsonl &
          suivi=$!
          set +e
          npm run test:e2e -- --workers="$VAULT_E2E_WORKERS"
          code=$?
          kill "$suivi" 2>/dev/null || true
          wait "$suivi" 2>/dev/null || true
          exit "$code"

      - name: Espace disque après les scénarios
        if: always()
        run: node tools/mesure-espace-disque.mjs --etape apres-e2e

      - name: Mesures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesures-reprise
          path: |
            reports/e2e/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
