name: Intégration VM

# Preuve « intégration VM » du spike #4. Elle démarre un vrai guest Linux et télécharge des
# artefacts tiers : elle n'est donc PAS un contrôle obligatoire de PR. Voir `docs/testing.md`.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: vm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: Barrière de durabilité du guest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v5

      - name: Installation de Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Installation de Chromium
        run: npx playwright install --with-deps chromium

      - name: Récupération vérifiée des artefacts v86
        run: npm run vm:fetch

      - name: Intégration VM
        run: npm run test:vm

      - name: Protocole de mesure
        if: always()
        run: npm run vm:protocol -- --boots 5

      - name: Mesures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesures-vm
          path: |
            reports/vm/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
