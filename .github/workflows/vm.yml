name: Intégration VM

# Preuve « intégration VM » du spike #4. Elle démarre un vrai guest Linux et télécharge des
# artefacts tiers : elle n'est donc PAS un contrôle obligatoire de PR. Voir `docs/testing.md`.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: vm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: Barrière de durabilité du guest
    runs-on: ubuntu-latest
    # Budget mesuré : la suite VM dure 19 à 22 min et le protocole de mesure 7 min ; les
    # dépendances peuvent en coûter 7 sans cache. À 30 min, le protocole était tué (SIGTERM,
    # code 143) alors que les épreuves avaient réussi. 45 laisse la marge d'un run sans cache.
    timeout-minutes: 45
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      # Depuis #74 le job installe TROIS moteurs au lieu d'un : le téléchargement domine désormais sa
      # durée. La clé porte la version de `@playwright/test` résolue dans `package-lock.json` — les
      # binaires des moteurs sont liés à cette version, et une clé sur autre chose restituerait des
      # moteurs que la bibliothèque refuserait de piloter (#87).
      - name: Cache des moteurs Playwright
        id: cache-moteurs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Les trois moteurs, depuis #74 : `test:vm` porte un témoin de démarrage du guest sur
      # Chromium, Firefox et WebKit. Sans Firefox ni WebKit installés, ce témoin ne s'exécuterait
      # pas — et la matrice de `docs/compatibility.md` reposerait de nouveau sur un seul moteur.
      #
      # `--with-deps` est réexécuté même sur cache retrouvé : le cache porte les BINAIRES des
      # moteurs, jamais les paquets système du runner, qui sont remis à zéro à chaque job. Sur cache
      # retrouvé, `playwright install` constate que les moteurs sont là et ne télécharge rien.
      - name: Installation des moteurs
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Récupération vérifiée des artefacts v86
        run: npm run vm:fetch

      - name: Intégration VM
        run: npm run test:vm

      - name: Protocole de mesure
        if: always()
        run: npm run vm:protocol -- --boots 5

      - name: Mesures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mesures-vm
          path: |
            reports/vm/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
