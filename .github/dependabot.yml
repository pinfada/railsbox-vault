# Mécanisme de mise à jour des actions ÉPINGLÉES PAR SHA (#105).
#
# L'épinglage par SHA supprime les montées de version automatiques : un `uses:` figé sur un commit
# ne bouge plus jamais tout seul, y compris quand la version figée reçoit un correctif de sécurité.
# L'épinglage sans mécanisme de mise à jour échange donc un risque contre un autre. C'est le couple
# que l'issue #105 demandait de trancher, pas l'épinglage seul.
#
# Dependabot sait lire un `uses: owner/action@<sha> # vX.Y.Z`, proposer le SHA de la version
# suivante et RÉÉCRIRE le commentaire d'étiquette avec elle. C'est pour cela que le cliquet
# `tests/unit/workflows-actions-epinglees.test.mjs` exige les deux moitiés de la convention : sans
# le commentaire, cette mise à jour n'a plus de repère.
#
# Une proposition de Dependabot reste une PR ordinaire : elle passe le contrôle « Qualité et tests »
# et une revue humaine, qui est l'endroit où l'on regarde ce que le nouveau SHA contient.

version: 2

updates:
  # Les dépendances de développement exécutent du code dans la CI et fabriquent les artefacts :
  # elles font donc partie de la chaîne d'approvisionnement même si le navigateur ne les charge pas.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Trois lots au lieu d'un (17/09/2026, PR #227 fermée) : une montée de Playwright change les
      # MOTEURS de navigateur, et une montée de v86 exige la procédure « Monter v86 de version »
      # (docs/development.md : manifeste, empreintes, garde de mémoire). Chacune bloquerait le lot
      # entier si elle y restait ; séparées, les autres montées npm continuent de passer.
      npm:
        patterns:
          - "*"
        exclude-patterns:
          - "@playwright/*"
          - "playwright*"
          - "v86"
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"
      v86:
        patterns:
          - "v86"
    ignore:
      # Playwright 1.65.x embarque Firefox 159 (build 1572) : le processus de contenu plante
      # (SIGSEGV, « Page crashed ») quand le moteur de rôles de Playwright puis axe s'exécutent sur la
      # page du parcours ; l'apparence Firefox rougit (#231, `docs/compatibility.md`). Non reproduit
      # sous 1.64.0 (build 1555) ni sous 1.66.0-alpha-2026-11-18 (build 1578), mesuré le 18/11/2026.
      # Retirer cette exclusion avec la montée à Playwright 1.66 (Firefox build >= 1578). L'exclusion
      # de 1.63.x, levée par la même PR, ne reviendra pas : le produit constate désormais l'OPFS par un
      # appel (WebKit >= 26.6 le rejette en contexte éphémère).
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
    commit-message:
      prefix: chore
    labels:
      - area:security

  # Le verrou de l'application de référence est distinct du verrou npm et doit recevoir ses propres
  # avis de sécurité. Dependabot relit apps/reference/Gemfile.lock depuis ce répertoire.
  - package-ecosystem: bundler
    directory: /apps/reference
    schedule:
      interval: weekly
    groups:
      ruby:
        patterns:
          - "*"
    commit-message:
      prefix: chore
    labels:
      - area:security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Un lot hebdomadaire plutôt qu'une PR par action : ces montées se relisent ensemble.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
    labels:
      - area:security
