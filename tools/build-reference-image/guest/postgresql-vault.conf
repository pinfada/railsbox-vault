# Configuration de PostgreSQL dans un coffre (#343, ADR 0056).
#
# Elle vit dans le ROOTFS (/opt/vault/postgresql.conf) et non dans le volume : le serveur est
# lancé avec `config_file` pointé ici, si bien que le postgresql.conf qu'initdb a écrit dans le
# datadir n'est jamais lu. Une version suivante de l'outil peut donc changer ces réglages pour les
# coffres existants, et une application ne peut pas les figer dans ses données.
#
# Reprise de RailsBox (pinfada/railsbox, tools/build-v86-image/base/rib/postgresql-railsbox.conf) :
# le dimensionnement mémoire, le socket local, la journalisation sur la série. NON reprise : sa
# section « Durabilité désactivée » (fsync, synchronous_commit et full_page_writes à off) —
# décision du mainteneur du 27/11/2026. `tools/build-reference-image/postgresql-durable.mjs`
# refuse ce fichier s'il affaiblit l'un d'eux, et le guest relit par SHOW, à chaque boot, ce que
# le serveur applique (`postgresql.sh verifier`).

# --- Durabilité : une écriture acquittée est sur le disque ------------------------------------
#
# fsync              le serveur synchronise le WAL et les fichiers de données. Chaque fsync du
#                    guest est une barrière FLUSH CACHE, que le pont de durabilité n'acquitte
#                    qu'après validation de la génération dans l'OPFS (ADR 0004, #209).
# synchronous_commit le COMMIT n'est rendu au client qu'une fois son WAL synchronisé. À `off`, une
#                    écriture acquittée vivrait jusqu'à 3 × wal_writer_delay dans la mémoire du
#                    serveur : un verrouillage dans cette fenêtre la perdrait.
# full_page_writes   la première modification d'une page après un checkpoint écrit la page entière
#                    dans le WAL. Sans elle, une coupure au milieu de l'écriture d'une page de
#                    8 Kio (deux blocs de 4 Kio du disque) laisserait une page déchirée que le WAL
#                    ne saurait pas réparer.
# wal_sync_method    fdatasync, la valeur par défaut sous Linux : écrite pour être lue et vérifiée.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_sync_method = fdatasync

# Les contrôles d'intégrité restent ARMÉS. data_sync_retry = off : un fsync en échec arrête le
# serveur (PANIC) au lieu d'être retenté sur des pages que le noyau a peut-être déjà jetées.
ignore_checksum_failure = off
zero_damaged_pages = off
data_sync_retry = off

# --- Connexions : le socket local, rien d'autre -------------------------------------------------
#
# Aucune écoute TCP. Le guest n'a pas de réseau, et l'application reçoit un DATABASE_URL qui passe
# par le socket. RailsBox écoutait sur 127.0.0.1 : inutile ici, et un port de moins.
listen_addresses = ''
unix_socket_directories = '/run/postgresql'
hba_file = '/opt/vault/postgresql-hba.conf'
# Puma tourne avec RAILS_MAX_THREADS=2 : deux connexions pour l'application, une pour la vérification
# du guest, de la marge pour une migration et pour psql.
max_connections = 10
superuser_reserved_connections = 2

# --- Mémoire : 512 Mio pour tout le guest -------------------------------------------------------
#
# Le guest porte le noyau, Ruby, Rails et ce serveur dans 512 Mio (ADR 0056, mesures). Ces valeurs
# sont plus basses que celles de RailsBox (24 Mo de shared_buffers pour 1 Gio).
shared_buffers = 16MB
work_mem = 1MB
maintenance_work_mem = 16MB
temp_buffers = 4MB
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
# Le JIT exige libLLVM, qui n'est pas dans le rootfs (voir guest.Dockerfile).
jit = off
# /dev/shm est un tmpfs monté par l'init.
dynamic_shared_memory_type = posix
huge_pages = off

# --- WAL et checkpoints -------------------------------------------------------------------------
#
# Un checkpoint écrit toutes les pages modifiées : moins il y en a, moins le guest écrit en tâche de
# fond. La reprise sur crash qui suit chaque verrouillage rejoue le WAL depuis le dernier.
checkpoint_timeout = 15min
max_wal_size = 64MB
min_wal_size = 32MB

# --- Journal : sur la série, ce qui aide à diagnostiquer ----------------------------------------
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '[postgresql] '
log_min_messages = warning
log_checkpoints = off
log_timezone = 'UTC'
timezone = 'UTC'
