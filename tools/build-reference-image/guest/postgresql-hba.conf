# Authentification du cluster PostgreSQL d'un coffre (#343, ADR 0056).
#
# Le serveur n'écoute sur aucun port TCP (`listen_addresses = ''`) : seul le socket local du guest
# y mène, et le guest n'a pas de réseau. `trust` y suffit, et épargne à chaque connexion le coût
# d'un échange SCRAM sous émulation. Aucune ligne `host` : une connexion TCP serait refusée même si
# une écoute était ouverte.
local all all trust
