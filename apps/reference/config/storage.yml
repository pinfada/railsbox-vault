# Un seul service : le disque local, enraciné dans le volume applicatif. Aucun
# service distant n'est déclaré — un identifiant de service inconnu doit faire
# échouer le démarrage, pas basculer sur un stockage réseau.
#
# `DurableDisk` et non `Disk` (#209) : le même service, qui synchronise le fichier
# téléversé puis les répertoires créés avant de rendre la main. Voir
# `lib/active_storage/service/durable_disk_service.rb`.
local:
  service: DurableDisk
  root: <%= ENV.fetch("VAULT_STORAGE_ROOT") { Rails.root.join("var/storage").to_s } %>
